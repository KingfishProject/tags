name: Series Sunstripe Solar
slug: series-sunstripe-solar
description: "One of the largest solar projects in Louisiana history — a 10,356-acre, 16-square-mile buildout by Austin developer Treaty Oak on timberland near Hineston, on the Rapides–Vernon parish line. It surfaced with no announcement, through a single federal wetlands permit. Kingfish tracks the permits it still needs, the environmental stakes, the tangle of Macquarie-managed ownership behind developer, utility, and data center — and the question no one will answer: who buys the power?"
