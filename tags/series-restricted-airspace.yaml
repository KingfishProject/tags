name: Restricted Airspace
slug: series-restricted-airspace
description: "An investigation into England Airpark, the economic development authority governing a decommissioned Air Force base in Alexandria, Louisiana. The district operates with its own board and its own rules, and answers to almost no one: records shielded by non-disclosure agreements, decisions made with little public notice, and a bad habit of ignoring public records requests they don't like. At stake is whether a public authority can keep governing in the dark."
