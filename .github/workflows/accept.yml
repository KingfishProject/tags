name: Record merged Ghost changes

# When the "Changes made in Ghost" pull request is merged, record those Ghost
# changes as the new starting point for comparisons. Ghost isn't changed.
# Without this, editing the same field again in GitHub before the next
# release would make the old Ghost edit show up as new.

on:
  pull_request_target:
    types: [closed]

permissions:
  actions: read
  contents: write


jobs:
  accept:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'ghost-sync/drift' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # The default branch, which now includes the merged changes.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wait for earlier sync runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/wait-turn.sh

      - name: Fetch last-deployed state
        run: |
          if git fetch --quiet --depth=1 origin ghost-state; then
            git show FETCH_HEAD:state.json > "$RUNNER_TEMP/state.json"
          fi

      - name: Save the pull request description
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$BODY" > "$RUNNER_TEMP/pr-body.md"

      - name: Record
        id: accept
        env:
          GHOST_API_URL: ${{ secrets.GHOST_API_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
          CLOUDFLARE_BYPASS_TOKEN: ${{ secrets.CLOUDFLARE_BYPASS_TOKEN }}
        run: >-
          node scripts/deploy.js --mode accept
          --source "import from #${{ github.event.pull_request.number }}"
          --state "$RUNNER_TEMP/state.json"
          --state-out "$RUNNER_TEMP/new-state.json"
          --pr-body "$RUNNER_TEMP/pr-body.md"

      - name: Record the new state
        if: steps.accept.outputs.status == 'done'
        run: scripts/save-state.sh "$RUNNER_TEMP/new-state.json" "Recorded merged Ghost changes from #${{ github.event.pull_request.number }}"
