name: Revert Ghost changes

# When the "Changes made in Ghost" pull request is closed without merging,
# put Ghost back the way this repo has it. Only the changes listed in that
# pull request are undone.

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: ghost-write
  cancel-in-progress: false

jobs:
  revert:
    if: >-
      github.event.pull_request.merged == false &&
      github.event.pull_request.head.ref == 'ghost-sync/drift' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # The default branch, never the pull request's code.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Fetch last-deployed state
        run: |
          if git fetch --quiet --depth=1 origin ghost-state; then
            git show FETCH_HEAD:state.json > "$RUNNER_TEMP/state.json"
          fi

      - name: Save the pull request description
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$BODY" > "$RUNNER_TEMP/pr-body.md"

      - name: Revert
        id: revert
        env:
          GHOST_API_URL: ${{ secrets.GHOST_API_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: >-
          node scripts/deploy.js --mode revert
          --source "revert of #${{ github.event.pull_request.number }}"
          --state "$RUNNER_TEMP/state.json"
          --state-out "$RUNNER_TEMP/new-state.json"
          --pr-body "$RUNNER_TEMP/pr-body.md"

      - name: Record the new state
        if: steps.revert.outputs.status == 'done'
        run: scripts/save-state.sh "$RUNNER_TEMP/new-state.json" "Reverted Ghost changes from #${{ github.event.pull_request.number }}"
